services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend-server
    container_name: express_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - ./backend-server/uploads:/app/uploads

  frontend:
    build: ./mi-app-modS
    container_name: angular_app
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./mi-app-modS:/app
      - /app/node_modules

volumes:
  db_data: